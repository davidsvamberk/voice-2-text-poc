[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "transcriber-worker"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "faster-whisper==1.2.1",
    "ctranslate2==4.6.0",
    "av==16.0.1",
    "numpy==2.3.4",
]

[tool.setuptools.packages.find]
include = ["transcriber_worker*"]
